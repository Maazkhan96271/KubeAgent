services:
  kubeagent-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: kubeagent-backend:local
    container_name: kubeagent-backend
    # Values from .env override the defaults below; the file is optional so a
    # fresh clone still boots in simulation mode.
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      # uvicorn listens on 8000 inside the container; map a different host port
      # with PORT=8080 docker compose up.
      PORT: "8000"
    ports:
      - "${PORT:-8000}:8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
